name: Python distributions

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'python/**'
      - 'rust/**'
      - 'web/**'
      - 'scripts/**'
      - 'packaging_tests/**'
      - 'Cargo.*'
      - 'pyproject.toml'
      - 'build_backend.py'
      - 'README.md'
      - '.github/workflows/python-package.yml'
  push:
    branches: [main, master, develop, 'release/**', 'hotfix/**']

permissions:
  contents: read

concurrency:
  group: python-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdist:
    name: Build terminal and source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
      - name: Build and audit source distribution
        run: |
          python -m pip install 'maturin>=1.14,<2' 'pytest>=9,<10'
          python -m pytest -q packaging_tests/test_build_backend.py packaging_tests/test_build_package.py
          python scripts/build_package.py --sdist-only
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: ${{ matrix.build }}
    needs: sdist
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            build: manylinux_x86_64
          - runner: ubuntu-24.04-arm
            build: manylinux_aarch64
          - runner: macos-15-intel
            build: macosx_x86_64
          - runner: macos-15
            build: macosx_arm64
          - runner: windows-2025
            build: win_amd64
          - runner: windows-11-arm
            build: win_arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v4
        with:
          name: python-sdist
          path: dist
      - name: Select source distribution
        id: sdist
        shell: python
        run: |
          import os
          from pathlib import Path
          archives = list(Path('dist').glob('*.tar.gz'))
          assert len(archives) == 1, archives
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'path={archives[0].as_posix()}\n')
      - name: Install native Rust toolchain
        if: runner.os != 'Linux'
        shell: bash
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
      - name: Build and test installed wheels for the Python versions in pyproject.toml
        uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
          output-dir: wheelhouse
      - name: Audit wheel contents and PyPI metadata
        shell: bash
        run: |
          python -m pip install 'twine>=6.2,<7'
          python scripts/check_distributions.py wheelhouse
          python -m twine check --strict wheelhouse/*
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.build }}
          path: wheelhouse/*.whl
          if-no-files-found: error
