name: Rust library

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"
      - "scripts/check_lobo.py"
      - "scripts/publish_rust.py"
      - "packaging_tests/test_publish_rust.py"
      - ".github/workflows/rust-package.yml"
  push:
    branches: [main, master]
    tags: ["rust-v*", "v*"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"
      - "scripts/check_lobo.py"
      - "scripts/publish_rust.py"
      - "packaging_tests/test_publish_rust.py"
      - ".github/workflows/rust-package.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to check or resume using this workflow version"
        type: string
        default: ""
      publish:
        description: "Publish the selected release tag after checks pass"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rust-library-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.release_tag == '' && !inputs.publish }}

env:
  # Cargo 1.97 fixes the workspace publishing deadlock in 1.96.1.
  RUST_TOOLCHAIN: "1.97.0"
  RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      release_tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
      - name: Resolve release source
        id: source
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            git check-ref-format "refs/tags/$RELEASE_TAG"
          elif [ "$PUBLISH_REQUESTED" = true ]; then
            echo "::error::Publishing requires a rust-vX.Y.Z or vX.Y.Z release tag."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Test release validation and retry behavior
        run: python3 -m unittest discover -s packaging_tests -p test_publish_rust.py
      - name: Verify release tag and workspace versions
        if: env.RELEASE_TAG != ''
        run: python3 scripts/publish_rust.py --tag "$RELEASE_TAG" --check
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-library-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust/**/Cargo.toml') }}
          restore-keys: rust-library-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Check API, feature isolation, examples, and docs
        run: python3 scripts/check_lobo.py
      - name: Verify registry packages without publishing
        run: cargo publish --workspace --exclude lobo_py --exclude lobo_wasm --exclude lobo_replay_tests --dry-run

  publish:
    name: Publish Rust workspace to crates.io
    needs: check
    if: >-
      github.repository == 'iamorlando/lobo' &&
      needs.check.outputs.release_tag != '' &&
      ((github.event_name == 'push' && github.ref_type == 'tag') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: cargo
      url: https://crates.io/crates/lobo-rs
    concurrency:
      group: crates-io-lobo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.source_sha }}
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-library-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust/**/Cargo.toml') }}
          restore-keys: rust-library-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: Publish unpublished workspace versions
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/publish_rust.py --tag "$RELEASE_TAG" --publish
