name: Terminal application
on:
  pull_request:
    paths: ["cli/**", "rust/**", "Cargo.toml", ".github/workflows/cli-release.yml"]
  push:
    branches: [main, master, "cli/**"]
    tags: ["cli-v*"]
    paths: ["cli/**", "rust/**", "Cargo.toml", ".github/workflows/cli-release.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cli/target
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      # Only format/check this app, never the protected library workspace.
      - run: cargo fmt --manifest-path cli/Cargo.toml --check
      - run: cargo clippy --manifest-path cli/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path cli/Cargo.toml --locked
      - run: python3 -m unittest discover -s cli/packaging -p 'test_*.py'
      - run: cargo build --manifest-path cli/Cargo.toml --locked --release --target ${{ matrix.target }}
      - name: Build native archive with bundled completions and offline smoke test
        shell: bash
        run: |
          version=$(python3 -c 'import pathlib,re; print(re.search(r"version = \"([^\"]+)\"",pathlib.Path("cli/Cargo.toml").read_text())[1])')
          if [ "${{ github.ref_type }}" = tag ] && [ "${{ github.ref_name }}" != "cli-v$version" ]; then
            echo "CLI tag and application version differ" >&2
            exit 1
          fi
          cli/target/${{ matrix.target }}/release/lobo --renderer cpu --snapshot-json --capture-seconds 0.1 > cli-state.json
          python3 cli/packaging/smoke_terminal.py --binary cli/target/${{ matrix.target }}/release/lobo
          python3 cli/packaging/smoke_sources.py --binary cli/target/${{ matrix.target }}/release/lobo
          python3 cli/packaging/smoke_shared.py --binary cli/target/${{ matrix.target }}/release/lobo
          python3 cli/packaging/smoke_shared_terminal.py --binary cli/target/${{ matrix.target }}/release/lobo --frames 90
          if command -v tmux >/dev/null; then
            python3 cli/packaging/smoke_mux.py --binary cli/target/${{ matrix.target }}/release/lobo
          fi
          python3 cli/packaging/release.py archive --version "$version" --target '${{ matrix.target }}' --binary 'cli/target/${{ matrix.target }}/release/lobo'
      - uses: actions/upload-artifact@v4
        with:
          name: lobo-${{ matrix.target }}
          path: |
            cli/dist/*.tar.gz
            cli/dist/*.sha256
  package:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lobo-*
          merge-multiple: true
          path: cli/dist
      - name: Generate checksum-verified Homebrew formula
        run: |
          version=$(python3 -c 'import pathlib,re; print(re.search(r"version = \"([^\"]+)\"",pathlib.Path("cli/Cargo.toml").read_text())[1])')
          python3 cli/packaging/release.py formula --version "$version" --base-url "https://github.com/${{ github.repository }}/releases/download/cli-v$version" --output cli/dist/Formula/lobo.rb
          ruby -c cli/dist/Formula/lobo.rb
      - uses: actions/upload-artifact@v4
        with:
          name: lobo-homebrew
          path: |
            cli/dist/Formula/lobo.rb
            cli/dist/SHA256SUMS
            cli/dist/*.bottle.tar.gz
      - name: Prepare draft release for deliberate publication
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'cli-v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --draft --title "Lobo terminal $RELEASE_TAG" --notes-file cli/packaging/RELEASE.md
          gh release upload "$RELEASE_TAG" cli/dist/*.tar.gz cli/dist/SHA256SUMS cli/dist/Formula/lobo.rb
  brew-test:
    needs: package
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lobo-homebrew
          path: cli/dist
      - name: Pour the real native bottle and verify installed application
        shell: bash
        run: |
          tap="$(brew --repository)/Library/Taps/iamorlando/homebrew-lobo"
          mkdir -p "$tap/Formula"
          git -C "$tap" init -q
          python3 - "$tap" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path("cli/dist").resolve()
          formula = (root / "Formula/lobo.rb").read_text()
          formula = re.sub(r'https://github.com/[^"\s]+/releases/download/cli-v[^/"\s]+', root.as_uri(), formula)
          (pathlib.Path(sys.argv[1]) / "Formula/lobo.rb").write_text(formula)
          PY
          if brew help trust >/dev/null 2>&1; then
            brew trust --formula iamorlando/lobo/lobo
          fi
          brew install lobo
          brew test lobo
          lobo --version
