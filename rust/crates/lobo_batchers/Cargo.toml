[package]
name = "lobo_batchers"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
arrow = ["dep:arrow-array", "dep:arrow-schema"]
feather = ["arrow", "dep:arrow-ipc"]
wgpu = ["arrow", "dep:arrow-data", "dep:wgpu", "dep:web-sys", "dep:uuid"]
# Keep the original feature name as an alias.
gpu = ["wgpu"]

[dependencies]
bitflags = "2.11"
arrow-array = { version = "59.3.0", optional = true }
arrow-data = { version = "59.3.0", optional = true }
arrow-ipc = { version = "59.3.0", optional = true, default-features = false }
arrow-schema = { version = "59.3.0", optional = true }
lobo_events = { workspace = true }
lobo_primitives = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30.0.1", optional = true, default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "vulkan", "dx12"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", optional = true, default-features = false, features = ["std", "wgsl", "webgpu"] }
web-sys = { version = "0.3", optional = true, features = ["HtmlCanvasElement"] }
# Enable browser entropy for the UUID dependency used by lobo_primitives.
uuid = { version = "1.24.0", optional = true, features = ["js"] }

[dev-dependencies]
lobo_models = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "0.4.0"
