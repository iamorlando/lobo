[package]
name = "lobo_wasm"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lobo_adapters = { workspace = true, features = ["itchy", "kraken", "bitfinex", "server"] }
lobo_books = { workspace = true }
lobo_replay = { workspace = true, features = ["json"] }
lobo_models = { workspace = true }
lobo_storage = { workspace = true }
lobo_primitives = { workspace = true }
lobo_events = { workspace = true }
lobo_context = { workspace = true }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
lobo_batchers = { path = "../lobo_batchers", features = ["wgpu"] }
arrow-array = "59.3.0"
arrow-schema = "59.3.0"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3.105", features = ["HtmlCanvasElement", "console"] }
js-sys = "0.3.105"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "webgpu"] }

[lints]
workspace = true

[dev-dependencies]
naga = { version = "30.0.0", features = ["wgsl-in"] }
