[package]
name = "lobo_server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native order API and hosted order-book terminal"

[dependencies]
lobo_books = { workspace = true }
lobo_replay = { workspace = true, features = ["native", "json", "jit"] }
lobo_batchers = { path = "../lobo_batchers" }
lobo_context = { workspace = true, optional = true }
lobo_models = { workspace = true, features = ["server-api"] }
lobo_primitives = { workspace = true }
lobo_storage = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tower-http = { version = "0.6", features = ["fs"] }
parking_lot = "0.12.5"
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
pyo3 = { version = "0.29.0", optional = true }

[features]
default = []
python = ["dep:pyo3", "lobo_books/python", "dep:lobo_context", "lobo_context/python", "lobo_replay/python"]
feed-tests = ["lobo_replay/json"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.29"
futures-util = "0.3"
tempfile = "3"

[lints]
workspace = true
