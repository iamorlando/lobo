[package]
name = "lobo_context"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pyo3 = { version = "0.29.0", optional = true }
arrow-array = { version = "59.3.0", optional = true }
arrow-schema = { version = "59.3.0", optional = true }
lobo_primitives = { workspace = true }
tokio = { version = "1.53.1", features = ["sync", "rt"] }
lobo_events = { workspace = true }
lobo_batchers = { path = "../lobo_batchers", default-features = false }

[dev-dependencies]
lobo_batchers = { path = "../lobo_batchers", features = ["feather"] }
lobo_primitives = { workspace = true }
lobo_models = { workspace = true }
arrow-array = "59.3.0"
arrow-ipc = { version = "59.3.0", default-features = false }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true

[features]
python = ["dep:pyo3", "dep:arrow-array", "dep:arrow-schema", "lobo_batchers/feather", "tokio/rt-multi-thread"]
