[package]
name = "lobo_storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Configurable order storage, price levels, and execution policies for LOBO"

[dependencies]
lobo_models = { workspace = true }
lobo_events = { workspace = true }
lobo_primitives = { workspace = true }
polars = { workspace = true, optional = true }
pyo3 = { version = "0.29.0", features = ["uuid"], optional = true }
pyo3-polars = { workspace = true, optional = true }
rustc-hash = "2.1.3"
crc32fast = "1.5"
itoa = "1.0"
paste = "1.0"


[lints]
workspace = true

[features]
default = []
polars = ["dep:polars"]
python = [
    "dep:pyo3",
    "lobo_models/python",
    "lobo_primitives/python",
]
python-polars = ["python", "polars", "dep:pyo3-polars"]
