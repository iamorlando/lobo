[package]
name = "lobo-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/iamorlando/lobo"
description = "Native terminal market charts and order simulation for Lobo"
publish = false

# Independent application workspace, colocated with the library crates.
[workspace]
resolver = "3"

[[bin]]
name = "lobo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.5"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1.2.1", features = ["uuid1"] }
signal-hook = "0.3.18"
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "vulkan", "dx12"] }
pollster = "0.4"
bytemuck = { version = "1.25", features = ["derive"] }
lobo_adapters = { path = "../lobo_adapters", features = ["itchy", "kraken", "bitfinex", "server"] }
lobo_replay = { path = "../lobo_replay", features = ["native", "json"] }
lobo_batchers = { path = "../lobo_batchers" }
lobo_context = { path = "../lobo_context" }
lobo_models = { path = "../lobo_models", features = ["server-api"] }
lobo_primitives = { path = "../lobo_primitives" }
lobo_storage = { path = "../lobo_storage" }
lobo_events = { path = "../lobo_events" }
lobo_books = { path = "../lobo_books" }

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }

[profile.cli-release]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
