[package]
name = "lobo_replay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Market-data replay, custom adapters, and simulation for LOBO"

[dependencies]
lobo_batchers = { workspace = true }
lobo_context = { workspace = true }
lobo_events = { workspace = true }

serde_json = { version = "1.0", features = ["arbitrary_precision"], optional = true }
pyo3 = { version = "0.29.0", features = ["experimental-inspect", "multiple-pymethods"], optional = true }
pyo3-polars = { workspace = true, features = ["lazy"], optional = true }
serde = { workspace = true, optional = true }
flate2 = { version = "1.1.9", optional = true }
chrono = { version = "0.4.45", optional = true }
chrono-tz = { version = "0.10.4", optional = true }
tokio = { version = "1.53.1", features = ["rt", "net", "sync", "time", "macros"], optional = true }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"], optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"], optional = true }
futures-util = { version = "0.3", optional = true }
rayon = { version = "1.12.0", optional = true }
lobo_books = { workspace = true }
lobo_primitives = { workspace = true }
lobo_models = { workspace = true }
lobo_storage = { workspace = true }
polars = { workspace = true, features = ["lazy", "rows"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jiter = { version = "0.16", default-features = false, optional = true }
cranelift-codegen = { version = "0.133.1", optional = true }
cranelift-frontend = { version = "0.133.1", optional = true }
cranelift-module = { version = "0.133.1", optional = true }
cranelift-jit = { version = "0.133.1", optional = true }
lru = { version = "0.16", optional = true }

[features]
default = []
python = ["dep:pyo3", "native", "json", "jit", "lobo_context/python", "lobo_books/python"]
jit = ["json", "dep:jiter", "dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-module", "dep:cranelift-jit", "dep:lru"]
python-polars = ["python", "polars", "dep:pyo3-polars", "lobo_books/python-polars"]
native = ["dep:chrono", "dep:chrono-tz", "dep:serde", "dep:flate2", "dep:tokio", "dep:tokio-tungstenite", "dep:reqwest", "dep:futures-util"]
json = ["dep:serde_json", "dep:serde", "order-api"]
order-api = ["lobo_models/server-api"]
polars = ["dep:polars", "polars/dtype-time", "polars/temporal"]
concurrent = ["dep:rayon"]


[lints]
workspace = true

[dev-dependencies]
chrono-tz = "0.10.4"
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
crc32fast = "1.5"
chrono = "0.4.45"
