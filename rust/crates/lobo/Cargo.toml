[package]
name = "lobo-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Configurable limit order books, market-data replay, adapters, and streaming outputs"
readme = "README.md"
keywords = ["orderbook", "market-data", "replay", "trading"]
categories = ["data-structures", "simulation"]

[lib]
name = "lobo"

[lints]
workspace = true

[dependencies]
lobo_primitives = { workspace = true }
lobo_models = { workspace = true }
lobo_books = { workspace = true }
lobo_storage = { workspace = true }
lobo_events = { workspace = true }
lobo_adapters = { workspace = true, optional = true }
lobo_replay = { workspace = true, optional = true }
lobo_context = { workspace = true, optional = true }
lobo_batchers = { workspace = true, optional = true }
lobo_server = { workspace = true, optional = true }

[features]
# The complete native Rust library is the default. Python bindings live in lobo_py.
default = ["full"]
full = ["itch", "kraken", "bitfinex", "native", "jit", "concurrent", "polars", "server", "feather", "gpu"]

batchers = ["dep:lobo_batchers"]
context = ["dep:lobo_context", "batchers"]
replay = ["dep:lobo_replay", "context"]
adapters = ["dep:lobo_adapters", "replay"]
itch = ["adapters", "lobo_adapters/itchy"]
kraken = ["adapters", "lobo_adapters/kraken"]
bitfinex = ["adapters", "lobo_adapters/bitfinex"]
native = ["replay", "lobo_replay/native"]
json = ["replay", "order-api", "lobo_replay/json"]
order-api = ["replay", "lobo_replay/order-api"]
jit = ["json", "lobo_replay/jit"]
concurrent = ["replay", "lobo_replay/concurrent"]
polars = [
    "lobo_books/polars",
    "lobo_storage/polars",
    "lobo_adapters?/polars",
    "lobo_replay?/polars",
]
server = ["dep:lobo_server", "native", "jit"]
arrow = ["batchers", "lobo_batchers/arrow"]
feather = ["arrow", "lobo_batchers/feather"]
gpu = ["arrow", "lobo_batchers/wgpu"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "replay"
required-features = ["replay"]
